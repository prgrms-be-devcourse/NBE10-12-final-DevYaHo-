spring:
  application:
    name: wellbuying
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:wellbuying}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:CHANGE_ME_local_dev_google_client_id}
            client-secret: ${GOOGLE_CLIENT_SECRET:CHANGE_ME_local_dev_google_client_secret}
            scope:
              - email
              - profile
          kakao:
            client-id: ${KAKAO_CLIENT_ID:CHANGE_ME_local_dev_kakao_client_id}
            client-secret: ${KAKAO_CLIENT_SECRET:CHANGE_ME_local_dev_kakao_client_secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
            scope:
              - profile_nickname
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: ${JWT_SECRET:CHANGE_ME_local_dev_secret_key_min_256_bits_______}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:1800000}   # 30분
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7일

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
