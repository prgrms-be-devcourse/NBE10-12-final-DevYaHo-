spring:
  profiles:
    # 배포 시 SPRING_PROFILES_ACTIVE=prod로 주입, 미지정 시 로컬 개발(local)로 동작
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: wellbuying
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:wellbuying}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:wellbuying-payment}
      auto-offset-reset: earliest
  task:
    scheduling:
      pool:
        # 기본값(1)이면 모든 @Scheduled 메서드가 스레드 하나를 공유해서, 공동구매 마감 처리처럼
        # 오래 걸리는 배치 하나가 3초마다 도는 아웃박스 릴레이 등 다른 스케줄러까지 함께 지연시킨다
        size: 5
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:CHANGE_ME_local_dev_mail_username}
    password: ${MAIL_PASSWORD:CHANGE_ME_local_dev_mail_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:CHANGE_ME_local_dev_google_client_id}
            client-secret: ${GOOGLE_CLIENT_SECRET:CHANGE_ME_local_dev_google_client_secret}
            scope:
              - email
              - profile
          kakao:
            client-id: ${KAKAO_CLIENT_ID:CHANGE_ME_local_dev_kakao_client_id}
            client-secret: ${KAKAO_CLIENT_SECRET:CHANGE_ME_local_dev_kakao_client_secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
            scope:
              - profile_nickname
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

opensearch:
  uris: http://${OPENSEARCH_HOST:localhost}:${OPENSEARCH_PORT:9200}

jwt:
  secret: ${JWT_SECRET:CHANGE_ME_local_dev_secret_key_min_256_bits_______}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:1800000}   # 30분
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7일
  refresh-token-grace-seconds: ${JWT_REFRESH_TOKEN_GRACE_SECONDS:5} # RTR 유예 기간

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

oauth:
  success-redirect-uri: ${OAUTH_SUCCESS_REDIRECT_URI:http://localhost:3000/oauth/callback}
  failure-redirect-uri: ${OAUTH_FAILURE_REDIRECT_URI:http://localhost:3000/oauth/callback}

admin-seed:
  enabled: ${ADMIN_SEED_ENABLED:false}
  email: ${ADMIN_SEED_EMAIL:admin@wellbuying.local}
  password: ${ADMIN_SEED_PASSWORD:CHANGE_ME_local_dev_admin_password}

groupbuy-seed:
  enabled: ${GROUPBUY_SEED_ENABLED:false}

seller-info:
  encryption:
    # AES-256(32바이트) 키를 Base64로 인코딩한 값. 운영에서는 반드시 SELLER_INFO_ENC_KEY 환경변수로 주입할 것
    key: ${SELLER_INFO_ENC_KEY:Q0hBTkdFX01FX2xvY2FsX2Rldl8zMl9ieXRlX2tleSE=}

toss:
  base-url: ${TOSS_BASE_URL:https://api.tosspayments.com}
  secret-key: ${TOSS_SECRET_KEY:CHANGE_ME_local_dev_toss_test_secret_key}

billing-key:
  # 빌링키 암복호화용 마스터 키. AES-256(32바이트) 키를 Base64로 인코딩한 값이며,
  # 운영에서는 반드시 BILLING_KEY_MASTER_KEY 환경변수로 주입할 것 (seller-info.encryption.key와 같은 방식)
  master-key: ${BILLING_KEY_MASTER_KEY:Q0hBTkdFX01FX2xvY2FsX2Rldl9iaWxsaW5na2V5XyE=}
