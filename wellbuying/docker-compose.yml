services:
  postgres:
    image: postgres:16-alpine
    container_name: wellbuying-postgres
    environment:
      POSTGRES_DB: wellbuying
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - wellbuying-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: wellbuying-redis
    ports:
      - "6379:6379"
    volumes:
      - wellbuying-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: wellbuying-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT(9092)는 호스트 머신(./gradlew bootRun으로 뜨는 앱)용, INTERNAL(29092)은 같은 docker
      # 네트워크 위의 다른 컨테이너(kafka-ui 등)용 - advertised listener가 "localhost"면 컨테이너
      # 입장에선 자기 자신을 가리키게 돼서 브로커에 못 붙는다
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - wellbuying-kafka-data:/var/lib/kafka/data

  # Kafka 토픽/파티션/메시지/컨슈머 그룹을 브라우저에서 볼 수 있는 웹 UI (http://localhost:8090)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: wellbuying-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: wellbuying
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  opensearch:
    build:
      context: ./docker/opensearch
    container_name: wellbuying-opensearch
    mem_limit: 1800m
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true # 로컬 개발 전용 (운영 환경 적용 금지)
      - OPENSEARCH_JAVA_OPTS=-Xms900m -Xmx900m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - wellbuying-opensearch-data:/usr/share/opensearch/data

  # 로컬/CI에서 S3 presigned URL 발급·PUT·태깅을 실제로 검증하기 위한 S3 호환 오브젝트 스토리지 (phase18)
  minio:
    image: minio/minio:latest
    container_name: wellbuying-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - wellbuying-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # minio 기동 후 애플리케이션이 쓰는 버킷(wellbuying-dev)을 1회 생성하고 종료 - 없으면 presigned URL 발급은 되지만 실제 PUT이 실패한다
  minio-init:
    image: minio/mc:latest
    container_name: wellbuying-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/wellbuying-dev
      "

volumes:
  wellbuying-postgres-data:
  wellbuying-redis-data:
  wellbuying-kafka-data:
  wellbuying-opensearch-data:
  wellbuying-minio-data:
