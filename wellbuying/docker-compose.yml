services:
  postgres:
    image: postgres:16-alpine
    container_name: wellbuying-postgres
    environment:
      POSTGRES_DB: wellbuying
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - wellbuying-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: wellbuying-redis
    ports:
      - "6379:6379"
    volumes:
      - wellbuying-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: wellbuying-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - wellbuying-kafka-data:/var/lib/kafka/data

  opensearch:
    build:
      context: ./docker/opensearch
    container_name: wellbuying-opensearch
    mem_limit: 1800m
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms900m -Xmx900m
    ports:
      - "9200:9200"
    volumes:
      - wellbuying-opensearch-data:/usr/share/opensearch/data

volumes:
  wellbuying-postgres-data:
  wellbuying-redis-data:
  wellbuying-kafka-data:
  wellbuying-opensearch-data:
