services:
  postgres:
    image: postgres:16-alpine
    container_name: wellbuying-postgres
    environment:
      POSTGRES_DB: wellbuying
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - wellbuying-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: wellbuying-redis
    ports:
      - "6379:6379"
    volumes:
      - wellbuying-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  wellbuying-postgres-data:
  wellbuying-redis-data:
