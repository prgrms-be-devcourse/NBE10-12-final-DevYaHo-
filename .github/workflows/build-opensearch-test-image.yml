name: Build OpenSearch Test Image

# ────────────────────────────────────────────────────────────
# Nori 플러그인을 포함한 OpenSearch 테스트용 이미지를 미리 빌드해 ghcr.io에 올려둔다.
# AbstractIntegrationTest가 매 테스트 실행마다 이 이미지를 새로 빌드하는 대신
# 여기서 미리 push된 고정 태그를 pull해서 쓰도록 하기 위함
#   (테스트 중 Docker Hub 접근/플러그인 네트워크 설치가 CI에서 불안정했던 문제 해결)
# ────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
    paths:
      - "wellbuying/docker/opensearch/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/wellbuying-opensearch-test

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: ghcr.io 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드 및 push
        uses: docker/build-push-action@v5
        with:
          context: ./wellbuying/docker/opensearch
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:2.19.1-nori
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
