name: Deploy Backend to EC2

# ────────────────────────────────────────────────────────────
# 트리거 조건
#   - main 브랜치에 wellbuying/(백엔드) 변경이 push될 때 자동 실행
#   - 또는 GitHub Actions UI에서 수동 실행 (workflow_dispatch)
# ────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
    paths:
      - "wellbuying/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # ghcr.io에 이미지 push 권한

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/wellbuying-backend
  CONTAINER_NAME: wellbuying-backend
  NETWORK_NAME: wellbuying-net # redis/kafka/opensearch가 떠 있는 운영 docker-compose와 동일 네트워크
  TARGET_DIR: /home/ubuntu/wellbuying
  HOST_PORT: 8080
  CONTAINER_PORT: 8080

jobs:
  # [테스트 게이트] Testcontainers 기반 통합 테스트를 먼저 통과해야 배포 진행
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./wellbuying
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle  # ~/.gradle/caches, ~/.gradle/wrapper를 GHA 캐시에 저장 → 의존성 재다운로드 방지

      # AbstractIntegrationTest가 ghcr.io의 프리빌드 OpenSearch 테스트 이미지를 pull하므로 로그인 필요
      - name: ghcr.io 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 러너 업데이트 후 Docker가 credential helper(pass 등)를 기본으로 사용하면서
      # docker-java(Testcontainers 내부)가 ~/.docker/config.json 평문 auth를 찾지 못해 pull에 실패한다.
      # DOCKER_AUTH_CONFIG 환경변수는 docker-java가 읽지 않으므로 config.json에 직접 주입한다.
      - name: Testcontainers용 ghcr.io 인증 config.json 직접 주입
        run: |
          GHCR_AUTH=$(echo -n "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" | base64 -w 0)
          # 기존 config.json에 ghcr.io auth를 평문으로 추가 (credsStore 등 나머지 설정 유지)
          jq --arg auth "$GHCR_AUTH" '.auths["ghcr.io"] = {auth: $auth}' \
            ~/.docker/config.json > /tmp/docker_config.json
          mv /tmp/docker_config.json ~/.docker/config.json

      - name: Gradle 테스트 실행
        run: ./gradlew test --no-daemon

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 이미지 태그 결정 (커밋 SHA)
        run: echo "VERSION=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # GitHub Secrets에 등록된 값으로 .env 파일 생성 (application.yaml의 환경변수 플레이스홀더와 1:1 대응)
      # REDIS_HOST/KAFKA_BOOTSTRAP_SERVERS/OPENSEARCH_HOST는 같은 docker network(wellbuying-net) 위
      # 컨테이너 이름을 그대로 사용하므로 시크릿이 아니라 고정값으로 기입
      - name: .env 파일 생성
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          OAUTH_SUCCESS_REDIRECT_URI: ${{ secrets.OAUTH_SUCCESS_REDIRECT_URI }}
          OAUTH_FAILURE_REDIRECT_URI: ${{ secrets.OAUTH_FAILURE_REDIRECT_URI }}
          SELLER_INFO_ENC_KEY: ${{ secrets.SELLER_INFO_ENC_KEY }}
          TOSS_SECRET_KEY: ${{ secrets.TOSS_SECRET_KEY }}
          BILLING_KEY_MASTER_KEY: ${{ secrets.BILLING_KEY_MASTER_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        run: |
          echo "SPRING_PROFILES_ACTIVE=prod" > .env
          echo "DB_HOST=$(printf '%s' "$DB_HOST" | tr -d '\r\n')" >> .env
          echo "DB_NAME=$(printf '%s' "$DB_NAME" | tr -d '\r\n')" >> .env
          echo "DB_USERNAME=$(printf '%s' "$DB_USERNAME" | tr -d '\r\n')" >> .env
          echo "DB_PASSWORD=$(printf '%s' "$DB_PASSWORD" | tr -d '\r\n')" >> .env
          echo "REDIS_HOST=redis" >> .env
          echo "REDIS_PORT=6379" >> .env
          echo "KAFKA_BOOTSTRAP_SERVERS=kafka:9092" >> .env
          echo "OPENSEARCH_HOST=opensearch" >> .env
          echo "OPENSEARCH_PORT=9200" >> .env
          echo "MAIL_HOST=$(printf '%s' "$MAIL_HOST" | tr -d '\r\n')" >> .env
          echo "MAIL_USERNAME=$(printf '%s' "$MAIL_USERNAME" | tr -d '\r\n')" >> .env
          echo "MAIL_PASSWORD=$(printf '%s' "$MAIL_PASSWORD" | tr -d '\r\n')" >> .env
          echo "GOOGLE_CLIENT_ID=$(printf '%s' "$GOOGLE_CLIENT_ID" | tr -d '\r\n')" >> .env
          echo "GOOGLE_CLIENT_SECRET=$(printf '%s' "$GOOGLE_CLIENT_SECRET" | tr -d '\r\n')" >> .env
          echo "KAKAO_CLIENT_ID=$(printf '%s' "$KAKAO_CLIENT_ID" | tr -d '\r\n')" >> .env
          echo "KAKAO_CLIENT_SECRET=$(printf '%s' "$KAKAO_CLIENT_SECRET" | tr -d '\r\n')" >> .env
          echo "JWT_SECRET=$(printf '%s' "$JWT_SECRET" | tr -d '\r\n')" >> .env
          echo "CORS_ALLOWED_ORIGINS=$(printf '%s' "$CORS_ALLOWED_ORIGINS" | tr -d '\r\n')" >> .env
          echo "OAUTH_SUCCESS_REDIRECT_URI=$(printf '%s' "$OAUTH_SUCCESS_REDIRECT_URI" | tr -d '\r\n')" >> .env
          echo "OAUTH_FAILURE_REDIRECT_URI=$(printf '%s' "$OAUTH_FAILURE_REDIRECT_URI" | tr -d '\r\n')" >> .env
          echo "SELLER_INFO_ENC_KEY=$(printf '%s' "$SELLER_INFO_ENC_KEY" | tr -d '\r\n')" >> .env
          echo "TOSS_SECRET_KEY=$(printf '%s' "$TOSS_SECRET_KEY" | tr -d '\r\n')" >> .env
          echo "BILLING_KEY_MASTER_KEY=$(printf '%s' "$BILLING_KEY_MASTER_KEY" | tr -d '\r\n')" >> .env
          echo "AWS_S3_BUCKET=$(printf '%s' "$AWS_S3_BUCKET" | tr -d '\r\n')" >> .env

      - name: ghcr.io 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      # EC2(t3.large)가 x86_64라 별도 QEMU 크로스 빌드 없이 amd64 러너에서 바로 빌드
      - name: 이미지 빌드 및 push
        uses: docker/build-push-action@v5
        with:
          context: ./wellbuying
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: .env 파일을 EC2로 전송
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.KEY }}
          source: ".env"
          target: ${{ env.TARGET_DIR }}

      - name: EC2에 SSH로 접속하여 컨테이너 교체
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.KEY }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR,IMAGE_NAME,VERSION,CONTAINER_NAME,NETWORK_NAME,HOST_PORT,CONTAINER_PORT,TARGET_DIR
          script: |
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker pull $IMAGE_NAME:$VERSION
            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true
            docker network create $NETWORK_NAME || true
            docker run -d \
              --name $CONTAINER_NAME \
              --network $NETWORK_NAME \
              --restart unless-stopped \
              --env-file $TARGET_DIR/.env \
              -e TZ=Asia/Seoul \
              -p $HOST_PORT:$CONTAINER_PORT \
              -v wellbuying-backend-logs:/app/logs \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              $IMAGE_NAME:$VERSION
            docker image prune -f
            sleep 10
            docker ps | grep $CONTAINER_NAME || (docker logs $CONTAINER_NAME --tail 50 && exit 1)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          VERSION: ${{ env.VERSION }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          NETWORK_NAME: ${{ env.NETWORK_NAME }}
          HOST_PORT: ${{ env.HOST_PORT }}
          CONTAINER_PORT: ${{ env.CONTAINER_PORT }}
          TARGET_DIR: ${{ env.TARGET_DIR }}

      - name: 러너에 남은 임시 파일 삭제
        if: always()
        run: rm -f .env
